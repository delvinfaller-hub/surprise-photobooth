<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise Photo Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --curtain: #2b0f14;
    --curtain-deep: #1a0a0d;
    --gold: #e8b64c;
    --gold-soft: #f2cd7c;
    --film: #faf3e6;
    --flash: #ff6f91;
    --ink: #1a1210;
    --bulb: #fff2c8;
    --radius: 4px;
    --shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 50% -10%, #3a1620 0%, var(--curtain) 55%, var(--curtain-deep) 100%);
    font-family:'DM Sans', sans-serif;
    color:var(--film);
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    position:relative;
  }

  /* Velvet curtain reveal */
  .curtain-panel{
    position:fixed; top:0; bottom:0; width:52%;
    background:
      repeating-linear-gradient(90deg, #4a1721 0 18px, #3a1119 18px 36px);
    box-shadow: inset 0 0 120px rgba(0,0,0,.6);
    z-index:999;
    transition: transform 1.4s cubic-bezier(.77,0,.18,1);
    pointer-events:none;
  }
  .curtain-panel.left{ left:0; transform-origin:left; }
  .curtain-panel.right{ right:0; transform-origin:right; }
  body.open .curtain-panel.left{ transform: translateX(-105%); }
  body.open .curtain-panel.right{ transform: translateX(105%); }

  /* Marquee bulbs */
  .marquee{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom:6px; flex-wrap:wrap;
  }
  .bulb{
    width:9px; height:9px; border-radius:50%;
    background:var(--bulb);
    box-shadow:0 0 8px 2px rgba(255,242,200,.8);
    animation: twinkle 1.6s infinite ease-in-out;
  }
  .bulb:nth-child(odd){ animation-delay:.4s; }
  .bulb:nth-child(3n){ animation-delay:.8s; }
  @keyframes twinkle{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  .stage{
    width:100%; max-width:1040px;
    display:grid;
    grid-template-columns: 1.35fr .9fr;
    gap:28px;
    align-items:start;
  }
  @media (max-width: 860px){
    .stage{ grid-template-columns: 1fr; }
  }

  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(38px, 6vw, 60px);
    letter-spacing:4px;
    margin:0;
    text-align:center;
    color:var(--gold-soft);
    text-shadow: 0 0 24px rgba(232,182,76,.35);
  }
  .sub{
    text-align:center;
    color:#d8c3b0;
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin:4px 0 22px;
  }

  .booth{
    background: linear-gradient(180deg, #3a161d, #261014);
    border:1px solid rgba(232,182,76,.25);
    border-radius:14px;
    padding:20px;
    box-shadow: var(--shadow);
    position:relative;
  }
  .booth::before{
    content:"";
    position:absolute; inset:10px;
    border:2px solid rgba(232,182,76,.18);
    border-radius:8px;
    pointer-events:none;
  }

  .viewfinder{
    position:relative;
    aspect-ratio: 4/3;
    background:#0c0607;
    border-radius:8px;
    overflow:hidden;
    border: 3px solid var(--gold);
    box-shadow: 0 0 0 6px rgba(0,0,0,.35), inset 0 0 40px rgba(0,0,0,.6);
  }
  video, .flash-canvas{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  video.filter-bw{ filter: grayscale(1) contrast(1.15); }
  video.filter-sepia{ filter: sepia(.75) saturate(1.3) contrast(1.05); }
  video.filter-vintage{ filter: saturate(.7) contrast(1.1) brightness(1.05) hue-rotate(-6deg); }
  video.filter-normal{ filter: none; }

  .placeholder{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px;
    text-align:center; padding:20px;
    color:#e9d9c6;
    background: radial-gradient(circle at 50% 40%, #1c0f11, #0c0607);
  }
  .placeholder .icon{ font-size:34px; }
  .placeholder button, .primary-btn{
    font-family:'DM Sans', sans-serif;
    font-weight:700;
    background: var(--gold);
    color:#241009;
    border:none;
    padding:12px 22px;
    border-radius:999px;
    cursor:pointer;
    font-size:14px;
    letter-spacing:.5px;
    transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 6px 18px rgba(232,182,76,.35);
  }
  .placeholder button:hover, .primary-btn:hover{ transform: translateY(-2px); box-shadow:0 10px 24px rgba(232,182,76,.45); }
  .placeholder button:active, .primary-btn:active{ transform: translateY(0); }
  .primary-btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }

  .flash-overlay{
    position:absolute; inset:0; background:#fff; opacity:0;
    pointer-events:none;
  }
  .flash-overlay.pop{ animation: flashpop .35s ease-out; }
  @keyframes flashpop{ 0%{opacity:0;} 12%{opacity:1;} 100%{opacity:0;} }

  .countdown{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue', sans-serif;
    font-size:120px;
    color:#fff;
    text-shadow:0 0 30px rgba(0,0,0,.7);
    opacity:0; pointer-events:none;
  }
  .countdown.show{ opacity:1; }
  .countdown span{ animation: pulse .9s ease-in-out; }
  @keyframes pulse{ 0%{transform:scale(1.6); opacity:0;} 25%{transform:scale(1); opacity:1;} 100%{transform:scale(1); opacity:1;} }

  .controls{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-top:16px; flex-wrap:wrap;
  }
  .filters{ display:flex; gap:8px; flex-wrap:wrap; }
  .filter-chip{
    font-size:12px; letter-spacing:.5px; text-transform:uppercase;
    padding:7px 13px; border-radius:999px;
    border:1px solid rgba(232,182,76,.4);
    background:transparent; color:var(--gold-soft);
    cursor:pointer; font-family:'DM Sans',sans-serif;
    transition: all .15s ease;
  }
  .filter-chip.active, .filter-chip:hover{ background:var(--gold); color:#241009; border-color:var(--gold); }

  .status-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:14px; font-size:13px; color:#cbb8a6;
  }
  .dots{ display:flex; gap:6px; }
  .dot{ width:9px; height:9px; border-radius:50%; border:1px solid var(--gold); }
  .dot.filled{ background:var(--gold); }

  .caption-field{
    margin-top:16px;
  }
  .caption-field label{
    display:block; font-size:12px; text-transform:uppercase; letter-spacing:1px;
    color:#cbb8a6; margin-bottom:6px;
  }
  .caption-field input{
    width:100%;
    background:#160b0c;
    border:1px solid rgba(232,182,76,.35);
    color:var(--film);
    padding:10px 12px;
    border-radius:8px;
    font-family:'Caveat', cursive;
    font-size:20px;
  }
  .caption-field input:focus{ outline:none; border-color:var(--gold); }

  /* Film strip side panel */
  .strip-wrap{
    display:flex; flex-direction:column; align-items:center;
    gap:14px;
  }
  .strip{
    background: var(--film);
    padding:14px 14px 20px;
    border-radius:2px;
    box-shadow: var(--shadow);
    width:100%;
    max-width:260px;
    display:flex; flex-direction:column; gap:10px;
    position:relative;
    transform: rotate(1.2deg);
  }
  .strip::before, .strip::after{
    content:"";
    position:absolute; left:8px; right:8px; height:10px;
    background: repeating-linear-gradient(90deg, transparent 0 8px, rgba(0,0,0,.12) 8px 10px);
  }
  .strip::before{ top:2px; }
  .strip::after{ bottom:2px; }
  .frame{
    aspect-ratio: 4/3;
    background:#e9e0d0;
    border:1px solid rgba(0,0,0,.08);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .frame .num{
    position:absolute; bottom:4px; right:6px;
    font-family:'Bebas Neue', sans-serif;
    font-size:12px; color:#8a7a63; letter-spacing:1px;
  }
  .frame.empty{
    color:#b3a690; font-family:'Bebas Neue', sans-serif; letter-spacing:2px; font-size:13px;
  }
  .strip-caption{
    text-align:center;
    font-family:'Caveat', cursive;
    font-size:22px;
    color:#3a2a1e;
    margin-top:2px;
  }

  .actions{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
  }
  .ghost-btn{
    font-family:'DM Sans', sans-serif; font-weight:700; font-size:13px;
    background:transparent; color:var(--gold-soft);
    border:1px solid rgba(232,182,76,.5);
    padding:10px 18px; border-radius:999px; cursor:pointer;
    transition: all .15s ease;
  }
  .ghost-btn:hover{ background:rgba(232,182,76,.12); }

  footer{
    text-align:center; margin-top:26px; font-size:12px; color:#9a8571; letter-spacing:.5px;
  }

  .hidden{ display:none !important; }
</style>
</head>
<body>

  <div class="curtain-panel left"></div>
  <div class="curtain-panel right"></div>

  <div class="stage">
    <div style="grid-column: 1 / -1;">
      <div class="marquee">
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span>
      </div>
      <h1>Surprise Photo Booth</h1>
      <div class="sub">Strike a pose &middot; four shots &middot; one keepsake</div>
    </div>

    <!-- Camera / Booth column -->
    <div class="booth">
      <div class="viewfinder" id="viewfinder">
        <video id="video" autoplay playsinline muted class="filter-normal"></video>
        <div class="flash-overlay" id="flashOverlay"></div>
        <div class="countdown" id="countdown"></div>
        <div class="placeholder" id="placeholder">
          <div class="icon">📸</div>
          <div>Turn on the camera to open the booth</div>
          <button id="startCameraBtn">Open the Booth</button>
        </div>
      </div>

      <div class="controls">
        <div class="filters" id="filters">
          <button class="filter-chip active" data-filter="normal">Classic</button>
          <button class="filter-chip" data-filter="bw">B&amp;W</button>
          <button class="filter-chip" data-filter="sepia">Sepia</button>
          <button class="filter-chip" data-filter="vintage">Vintage</button>
        </div>
        <button class="primary-btn" id="captureBtn" disabled>Start Session</button>
      </div>

      <div class="status-row">
        <span id="statusText">Camera off</span>
        <div class="dots" id="dots">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>

      <div class="caption-field">
        <label for="captionInput">Message for the strip</label>
        <input id="captionInput" type="text" maxlength="40" placeholder="Happy Birthday, You're the Best!" value="You're the Best!">
      </div>
    </div>

    <!-- Film strip column -->
    <div class="strip-wrap">
      <div class="strip" id="strip">
        <div class="frame empty" data-slot="0">1</div>
        <div class="frame empty" data-slot="1">2</div>
        <div class="frame empty" data-slot="2">3</div>
        <div class="frame empty" data-slot="3">4</div>
        <div class="strip-caption" id="stripCaption">You're the Best!</div>
      </div>
      <div class="actions">
        <button class="ghost-btn" id="retakeBtn">Retake</button>
        <button class="primary-btn" id="downloadBtn" disabled>Download Strip</button>
      </div>
    </div>
  </div>

  <footer>Photos stay on this device &mdash; nothing is uploaded anywhere.</footer>

  <canvas id="captureCanvas" class="hidden"></canvas>
  <canvas id="finalCanvas" class="hidden"></canvas>

<script>
(function(){
  const video = document.getElementById('video');
  const placeholder = document.getElementById('placeholder');
  const startCameraBtn = document.getElementById('startCameraBtn');
  const captureBtn = document.getElementById('captureBtn');
  const retakeBtn = document.getElementById('retakeBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const statusText = document.getElementById('statusText');
  const countdownEl = document.getElementById('countdown');
  const flashOverlay = document.getElementById('flashOverlay');
  const dots = document.querySelectorAll('#dots .dot');
  const frames = document.querySelectorAll('#strip .frame');
  const captionInput = document.getElementById('captionInput');
  const stripCaption = document.getElementById('stripCaption');
  const captureCanvas = document.getElementById('captureCanvas');
  const finalCanvas = document.getElementById('finalCanvas');
  const filterButtons = document.querySelectorAll('.filter-chip');

  let stream = null;
  let currentFilter = 'normal';
  let shots = []; // dataURLs
  let busy = false;

  // Curtain reveal on load
  window.addEventListener('load', () => {
    setTimeout(() => document.body.classList.add('open'), 300);
  });

  captionInput.addEventListener('input', () => {
    stripCaption.textContent = captionInput.value || " ";
  });

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      video.className = 'filter-' + currentFilter;
    });
  });

  async function openCamera(){
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio:false });
      video.srcObject = stream;
      placeholder.classList.add('hidden');
      captureBtn.disabled = false;
      statusText.textContent = 'Camera ready — say cheese!';
    }catch(err){
      statusText.textContent = 'Camera access denied or unavailable';
      placeholder.querySelector('div:nth-child(2)').textContent =
        'Camera permission is needed. Please allow access in your browser and try again.';
    }
  }

  startCameraBtn.addEventListener('click', openCamera);

  function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

  async function runCountdown(){
    for(const n of ['3','2','1']){
      countdownEl.textContent = '';
      countdownEl.classList.add('show');
      const span = document.createElement('span');
      span.textContent = n;
      countdownEl.appendChild(span);
      await wait(800);
    }
    countdownEl.classList.remove('show');
  }

  function snap(){
    const w = video.videoWidth || 640;
    const h = video.videoHeight || 480;
    captureCanvas.width = w;
    captureCanvas.height = h;
    const ctx = captureCanvas.getContext('2d');
    const filterMap = {
      normal: 'none',
      bw: 'grayscale(1) contrast(1.15)',
      sepia: 'sepia(.75) saturate(1.3) contrast(1.05)',
      vintage: 'saturate(.7) contrast(1.1) brightness(1.05) hue-rotate(-6deg)'
    };
    ctx.filter = filterMap[currentFilter] || 'none';
    // mirror to match the preview
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, w, h);
    return captureCanvas.toDataURL('image/jpeg', 0.92);
  }

  function flash(){
    flashOverlay.classList.remove('pop');
    void flashOverlay.offsetWidth;
    flashOverlay.classList.add('pop');
  }

  function placeShot(dataUrl, index){
    const frame = frames[index];
    frame.classList.remove('empty');
    frame.innerHTML = '<img src="' + dataUrl + '"><span class="num">' + (index+1) + '</span>';
    dots[index].classList.add('filled');
  }

  async function startSession(){
    if(busy || !stream) return;
    busy = true;
    captureBtn.disabled = true;
    retakeBtn.disabled = true;
    shots = [];
    frames.forEach((f, i) => {
      f.className = 'frame empty';
      f.textContent = (i+1);
      dots[i].classList.remove('filled');
    });
    downloadBtn.disabled = true;

    for(let i=0; i<4; i++){
      statusText.textContent = 'Get ready — shot ' + (i+1) + ' of 4';
      await runCountdown();
      flash();
      await wait(120);
      const data = snap();
      shots.push(data);
      placeShot(data, i);
      statusText.textContent = 'Shot ' + (i+1) + ' captured!';
      await wait(500);
    }

    statusText.textContent = 'All done! Download your strip.';
    downloadBtn.disabled = false;
    captureBtn.disabled = false;
    retakeBtn.disabled = false;
    busy = false;
  }

  captureBtn.addEventListener('click', startSession);

  retakeBtn.addEventListener('click', () => {
    if(busy) return;
    shots = [];
    frames.forEach((f, i) => {
      f.className = 'frame empty';
      f.textContent = (i+1);
      dots[i].classList.remove('filled');
    });
    downloadBtn.disabled = true;
    statusText.textContent = stream ? 'Camera ready — say cheese!' : 'Camera off';
  });

  function buildFinalStrip(){
    const frameW = 480, frameH = 360, pad = 24, gap = 18, capH = 90, topH = 24, bottomH = 24;
    const stripW = frameW + pad*2;
    const stripH = topH + (frameH*4) + gap*3 + capH + bottomH;

    finalCanvas.width = stripW;
    finalCanvas.height = stripH;
    const ctx = finalCanvas.getContext('2d');

    // background
    ctx.fillStyle = '#faf3e6';
    ctx.fillRect(0,0,stripW,stripH);

    // perforation strips
    ctx.fillStyle = 'rgba(0,0,0,.10)';
    for(let x=10; x<stripW-10; x+=16){
      ctx.fillRect(x, 6, 8, 6);
      ctx.fillRect(x, stripH-14, 8, 6);
    }

    let y = topH;
    shots.forEach((src, i) => {
      const img = new Image();
      img.src = src;
      ctx.strokeStyle = 'rgba(0,0,0,.08)';
      ctx.strokeRect(pad, y, frameW, frameH);
      ctx.drawImage(img, pad, y, frameW, frameH);
      y += frameH + gap;
    });

    ctx.fillStyle = '#3a2a1e';
    ctx.font = '400 40px "Caveat", cursive';
    ctx.textAlign = 'center';
    const caption = captionInput.value || '';
    ctx.font = '40px cursive';
    ctx.fillText(caption, stripW/2, y + 55);
  }

  downloadBtn.addEventListener('click', async () => {
    if(shots.length < 4) return;
    // ensure images are loaded before drawing by re-drawing synchronously via onload chain
    const frameW = 480, frameH = 360, pad = 24, gap = 18, capH = 90, topH = 24, bottomH = 24;
    const stripW = frameW + pad*2;
    const stripH = topH + (frameH*4) + gap*3 + capH + bottomH;
    finalCanvas.width = stripW;
    finalCanvas.height = stripH;
    const ctx = finalCanvas.getContext('2d');
    ctx.fillStyle = '#faf3e6';
    ctx.fillRect(0,0,stripW,stripH);
    ctx.fillStyle = 'rgba(0,0,0,.10)';
    for(let x=10; x<stripW-10; x+=16){
      ctx.fillRect(x, 6, 8, 6);
      ctx.fillRect(x, stripH-14, 8, 6);
    }
    let y = topH;
    for(const src of shots){
      await new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          ctx.strokeStyle = 'rgba(0,0,0,.08)';
          ctx.strokeRect(pad, y, frameW, frameH);
          ctx.drawImage(img, pad, y, frameW, frameH);
          y += frameH + gap;
          resolve();
        };
        img.src = src;
      });
    }
    ctx.fillStyle = '#3a2a1e';
    ctx.textAlign = 'center';
    ctx.font = '40px "Caveat", cursive, sans-serif';
    const caption = captionInput.value || '';
    ctx.fillText(caption, stripW/2, y + 55);

    const link = document.createElement('a');
    link.download = 'surprise-photobooth-strip.png';
    link.href = finalCanvas.toDataURL('image/png');
    link.click();
  });

})();
</script>
</body>
</html>
